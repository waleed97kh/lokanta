# Keeps a free-tier Supabase project from pausing (they pause after 7 idle days).
# Optional: only needed if the client stays on the Free plan. Enable by adding two repository secrets:
#   SUPABASE_URL      https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY the anon key from Project settings → API (public by design)
# Without the secrets the job exits quietly.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 * * *'   # daily, 09:17 Istanbul
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "secrets not set, skipping"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/live?select=id" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          # 200 = read ok, 401/403 = reached the database but RLS refused (still counts as activity)
          case "$code" in 200|401|403) exit 0;; *) exit 1;; esac
